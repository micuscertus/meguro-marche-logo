<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MEGURO MARCHE</title>
<link rel="stylesheet" href="camera.css">
</head>
<body>
<div id="ss">
  <img id="sl" src="logo.jpg" alt="">
  <button id="sb" onclick="startCam()">カメラを起動する</button>
</div>
<div id="cs">
  <video id="v" autoplay playsinline muted></video>
  <img id="ol" src="logo.jpg" alt="">
  <button type="button" id="flipBtn" onclick="flipCamera()" aria-label="インカメとアウトカメを切り替え">
    <svg class="flip-svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
      <path d="M21 3v5h-5"/>
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
      <path d="M3 21v-5h5"/>
    </svg>
  </button>
  <div id="fl"></div>
  <button type="button" id="sh" onclick="snap()"></button>
  <div id="controls">
    <div class="crow"><span class="clabel">サイズ</span><input type="range" id="sz" min="10" max="95" value="44" oninput="applySliders()"></div>
    <div class="crow"><span class="clabel">左右</span><input type="range" id="px" min="0" max="100" value="50" oninput="applySliders()"></div>
    <div class="crow"><span class="clabel">上下</span><input type="range" id="py" min="0" max="100" value="30" oninput="applySliders()"></div>
  </div>
</div>
<div id="rs">
  <button type="button" id="bb" onclick="back()">もう一度撮る</button>
  <img id="ri" alt="">
  <p id="hint"></p>
  <div class="rs-actions">
    <button type="button" id="shareBtn" onclick="shareResult()">共有する・保存する</button>
  </div>
</div>
<canvas id="c" style="display:none"></canvas>
<script src="camera.js"></script>
</body>
</html>
